name: TOEFL Daily

on:
  schedule:
    # 07:23 و12:23 و16:23 و21:23 بتوقيت دمشق (UTC+3) = 04:23 و09:23 و13:23 و18:23 UTC
    - cron: "23 4,9,13,18 * * *"
  workflow_dispatch:        # تشغيل يدوي للتجربة

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gTTS
      - run: python toefl_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
